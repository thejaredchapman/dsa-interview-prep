<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DS&amp;A Interview Prep — Pinterest</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --border: 1px solid #e5e5e5;
      --radius: 8px;
      --easy-bg: #EAF3DE; --easy-text: #27500A;
      --med-bg: #FAEEDA; --med-text: #633806;
      --hard-bg: #FCEBEB; --hard-text: #791F1F;
      --pat-bg: #EEEDFE; --pat-text: #3C3489;
      --blue: #2563EB;
      --muted: #6b7280;
      --code-bg: #f4f4f5;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #f9fafb; color: #111827; min-height: 100vh; }

    /* ── COUNTDOWN ───────────────────────────────── */
    .countdown-bar {
      background: #fff; border-bottom: var(--border);
      padding: 14px 20px; text-align: center;
      position: sticky; top: 0; z-index: 200;
    }
    .countdown-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
    .countdown-time { font-family: 'Fira Code', monospace; font-size: clamp(18px,4vw,30px); font-weight: 600; letter-spacing: .04em; color: #111827; }
    .countdown-msg { font-size: 13px; color: var(--muted); margin-top: 5px; font-style: italic; }

    /* ── TABS ────────────────────────────────────── */
    .tab-nav {
      display: flex; background: #fff; border-bottom: var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      position: sticky; top: 0; z-index: 190;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 12px 16px; border: none; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap;
      border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
      font-family: inherit;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-btn:hover:not(.active) { color: #374151; }

    /* ── LAYOUT ──────────────────────────────────── */
    .container { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; }
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

    /* ── GENERIC CARD ────────────────────────────── */
    .card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; }

    /* ── GRID HELPERS ────────────────────────────── */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

    /* ── DAY PLAN ────────────────────────────────── */
    .day-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 18px; transition: border-color .18s, background .18s; }
    /* per-day color tokens */
    .day-card[data-day="1"] { --dc:#EF4444; --db:#FEF2F2; }
    .day-card[data-day="2"] { --dc:#F97316; --db:#FFF7ED; }
    .day-card[data-day="3"] { --dc:#D97706; --db:#FFFBEB; }
    .day-card[data-day="4"] { --dc:#10B981; --db:#ECFDF5; }
    .day-card[data-day="5"] { --dc:#06B6D4; --db:#ECFEFF; }
    .day-card[data-day="6"] { --dc:#8B5CF6; --db:#EEF2FF; }
    .day-card[data-day="7"] { --dc:#A855F7; --db:#FAF5FF; }
    .day-card[data-day="8"] { --dc:#EC4899; --db:#FDF2F8; }
    .day-card[data-day="9"] { --dc:#F43F5E; --db:#FFF1F2; }
    /* today */
    .day-card.today { border: 2px solid var(--blue); background: #EFF6FF; }
    .day-card.today .day-title { color: var(--blue); }
    .day-card.today .day-num { color: var(--blue); }
    /* hover — vivid per-day color, overrides today */
    .day-card.clickable:hover { border: 2px solid var(--dc) !important; background: var(--db) !important; }
    .day-card.clickable:hover .day-title { color: var(--dc); }
    .day-card.clickable:hover .day-num { color: var(--dc); opacity: .75; }
    .day-card.clickable:hover .topic-pill { background: var(--db); border: 1px solid var(--dc); color: var(--dc); }
    .day-card.clickable:hover .sched-period { color: var(--dc); }
    .day-card.clickable:hover .view-probs-hint { color: var(--dc); opacity: 1; }
    /* today pulse dot */
    @keyframes todayPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
    .today-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); display: inline-block; animation: todayPulse 1.8s ease-in-out infinite; flex-shrink: 0; }
    /* day indicator banner */
    .day-banner {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--radius);
      padding: 12px 16px; margin-bottom: 20px;
    }
    .day-banner-label { font-size: 12px; font-weight: 700; color: var(--blue); }
    .day-banner-title { font-size: 13px; font-weight: 600; color: #1E40AF; }
    .day-banner-date { font-size: 12px; color: #3B82F6; }
    .day-banner-link { margin-left: auto; padding: 5px 12px; border: 1px solid #BFDBFE; border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--blue); font-family: inherit; }
    .day-banner-link:hover { background: var(--blue); color: #fff; }
    .day-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .day-num { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); transition: color .18s; }
    .day-date { font-size: 12px; color: var(--muted); }
    .today-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--blue); color: #fff; padding: 3px 7px; border-radius: 3px; }
    .day-title { font-size: 15px; font-weight: 600; margin: 8px 0 10px; transition: color .18s; }
    .topic-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
    .topic-pill { background: var(--pat-bg); color: var(--pat-text); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 100px; transition: background .18s, color .18s, border-color .18s; }
    .schedule-list { display: flex; flex-direction: column; gap: 7px; }
    .sched-item { display: flex; gap: 8px; font-size: 12.5px; align-items: flex-start; }
    .sched-period { font-weight: 600; color: #374151; min-width: 72px; flex-shrink: 0; transition: color .18s; }
    .sched-task { color: #4b5563; flex: 1; line-height: 1.4; }
    .sched-dur { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
    .callout { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--radius); padding: 16px 20px; margin-top: 24px; font-size: 13.5px; line-height: 1.65; color: #1E40AF; }

    /* ── BADGES ──────────────────────────────────── */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-easy { background: var(--easy-bg); color: var(--easy-text); }
    .badge-medium { background: var(--med-bg); color: var(--med-text); }
    .badge-hard { background: var(--hard-bg); color: var(--hard-text); }
    .badge-pat { background: var(--pat-bg); color: var(--pat-text); }

    /* ── ANNOTATED CODE ──────────────────────────── */
    .code-pairs { display: flex; flex-direction: column; gap: 0; }
    .code-pair { margin-bottom: 5px; }
    .code-line-text {
      display: block; font-family: 'Fira Code', monospace; font-size: 12px;
      background: var(--code-bg); padding: 4px 10px; border-radius: 3px;
      white-space: pre; overflow-x: auto;
    }
    .code-note { font-size: 12px; color: var(--muted); padding: 2px 10px 3px; line-height: 1.45; }

    /* ── PATTERNS ────────────────────────────────── */
    .pattern-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .pattern-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .pattern-name { font-size: 16px; font-weight: 600; }
    .pattern-pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 100px; }
    .pattern-trigger { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 14px; }
    .pattern-trigger strong { font-style: normal; color: #374151; }

    /* ── FILTER BAR ──────────────────────────────── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .filter-btn {
      padding: 6px 14px; border: var(--border); border-radius: 100px;
      background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 500;
      color: #374151; transition: background .15s, color .15s, border-color .15s;
      font-family: inherit;
    }
    .filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .filter-btn:hover:not(.active) { border-color: #9ca3af; }

    /* ── FLASHCARDS ──────────────────────────────── */
    .flashcard-area { max-width: 580px; margin: 0 auto; }
    .flashcard-wrapper { perspective: 800px; height: 310px; cursor: pointer; user-select: none; margin-bottom: 18px; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s ease; }
    .flashcard-inner.flipped { transform: rotateY(180deg); }
    .fc-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: #fff; border: var(--border); border-radius: var(--radius);
      padding: 28px 24px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .fc-back-face { transform: rotateY(180deg); background: #FAFBFF; }
    .fc-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .fc-q { font-size: 16px; font-weight: 600; line-height: 1.5; flex: 1; display: flex; align-items: center; }
    .fc-a { font-size: 13.5px; line-height: 1.7; flex: 1; display: flex; align-items: flex-start; color: #1E40AF; padding-top: 4px; }
    .fc-hint { font-size: 11px; color: var(--muted); text-align: center; }
    .fc-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 8px; }
    .nav-btn { padding: 8px 20px; border: var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 13.5px; font-weight: 500; font-family: inherit; }
    .nav-btn:hover:not(:disabled) { background: #f5f5f5; }
    .nav-btn:disabled { opacity: .35; cursor: default; }
    .card-counter { font-family: 'Fira Code', monospace; font-size: 13px; color: var(--muted); }

    /* ── PROBLEMS ────────────────────────────────── */
    .problem-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; transition: border-color .2s, background .2s; }
    .problem-card.is-done { border-left: 3px solid #059669; background: #F0FDF4; }
    .prob-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    .prob-title { font-size: 15.5px; font-weight: 600; }
    .done-toggle {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid #d1d5db;
      background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 13px; transition: all .2s; flex-shrink: 0;
    }
    .done-toggle:hover { border-color: #059669; background: #F0FDF4; }
    .done-toggle.is-done { border-color: #059669; background: #059669; color: #fff; }
    .prob-progress { background: #fff; border: var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .prob-progress-text { font-size: 13px; color: #374151; font-weight: 600; }
    .prob-progress-bar-wrap { flex: 1; min-width: 120px; height: 6px; background: #e5e7eb; border-radius: 100px; overflow: hidden; }
    .prob-progress-bar-fill { height: 100%; background: #059669; border-radius: 100px; transition: width .3s; }
    .prob-desc { font-size: 13.5px; color: #4b5563; margin-bottom: 16px; line-height: 1.6; }
    .sol-tabs { display: flex; border-bottom: var(--border); margin-bottom: 14px; }
    .sol-tab { padding: 8px 16px; border: none; background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; font-family: inherit; }
    .sol-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .complexity-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .cx-badge { font-family: 'Fira Code', monospace; font-size: 11px; background: #f3f4f6; color: #374151; padding: 3px 8px; border-radius: 4px; border: 1px solid #e5e7eb; }
    .what-box { font-size: 13px; color: #4b5563; margin-bottom: 12px; padding: 8px 12px; background: #f9fafb; border-radius: 4px; line-height: 1.55; border-left: 3px solid #e5e7eb; }

    /* ── MOCK TIMER ──────────────────────────────── */
    .mock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 20px; }
    .mock-problem-panel { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    .mock-problem-title { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    .mock-problem-desc { font-size: 14px; color: #374151; line-height: 1.7; margin-bottom: 16px; }
    .mock-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; margin-top: 16px; }
    .mock-examples { display: flex; flex-direction: column; gap: 10px; }
    .mock-example { background: var(--code-bg); border-radius: 5px; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 12px; line-height: 1.7; }
    .mock-example-io { color: #374151; }
    .mock-example-label { color: var(--muted); font-size: 11px; margin-right: 4px; }
    .mock-example-explanation { font-size: 12px; color: var(--muted); font-family: inherit; font-style: italic; margin-top: 4px; font-family: 'Inter', sans-serif; }
    .mock-constraints { display: flex; flex-direction: column; gap: 4px; }
    .mock-constraint { font-size: 12.5px; color: #374151; padding: 3px 0; font-family: 'Fira Code', monospace; }
    .mock-no-problem { background: #f9fafb; border: var(--border); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
    .mock-card {
      background: #fff; border: var(--border); border-radius: var(--radius);
      padding: 14px 16px; cursor: pointer; transition: border-color .15s;
    }
    .mock-card.selected { border-color: var(--blue); background: #EFF6FF; }
    .mock-card:hover:not(.selected) { border-color: #9ca3af; }
    .mock-title { font-size: 13.5px; font-weight: 600; margin-bottom: 5px; }
    .mock-pat { font-size: 11.5px; color: var(--muted); }
    .timer-wrap { text-align: center; margin-bottom: 24px; }
    .timer-disp { font-family: 'Fira Code', monospace; font-size: clamp(52px,10vw,80px); font-weight: 600; letter-spacing: .05em; color: #111827; line-height: 1; }
    .timer-disp.warn { color: #D97706; }
    .timer-disp.danger { color: #DC2626; }
    .timer-alert { margin-top: 10px; font-size: 14px; font-weight: 600; color: #D97706; min-height: 22px; }
    .timer-alert.danger { color: #DC2626; }
    .timer-ctrls { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .t-btn { padding: 10px 24px; border-radius: 6px; border: var(--border); cursor: pointer; font-size: 14px; font-weight: 600; background: #fff; color: #374151; font-family: inherit; }
    .t-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .t-btn:hover:not(.primary) { background: #f5f5f5; }
    .protocol-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; }
    .protocol-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
    .p-item { display: flex; gap: 12px; margin-bottom: 10px; font-size: 13px; align-items: flex-start; }
    .p-time { font-family: 'Fira Code', monospace; font-size: 11px; background: var(--pat-bg); color: var(--pat-text); padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .p-desc { color: #4b5563; line-height: 1.5; }

    /* ── TIPS ────────────────────────────────────── */
    .tips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .tip-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; }
    .tip-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
    .tip-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .tip-list li { font-size: 13.5px; color: #374151; line-height: 1.5; padding-left: 16px; position: relative; }
    .tip-list li::before { content: '—'; position: absolute; left: 0; color: var(--muted); }

    /* ── HOME PAGE ───────────────────────────────── */
    .home-hero { text-align: center; padding: 32px 0 24px; }
    .home-title { font-size: clamp(22px,5vw,34px); font-weight: 700; margin-bottom: 8px; }
    .home-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
    .home-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
    .home-btn { padding: 11px 20px; border-radius: 8px; border: var(--border); background: #fff; cursor: pointer; font-size: 13.5px; font-weight: 600; color: #374151; transition: border-color .15s, color .15s; font-family: inherit; }
    .home-btn:hover { border-color: var(--blue); color: var(--blue); }
    .home-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .home-btn.primary:hover { background: #1d4ed8; color: #fff; }
    .home-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .home-stat { background: #fff; border: var(--border); border-radius: var(--radius); padding: 16px 18px; }
    .home-stat-val { font-family: 'Fira Code', monospace; font-size: 26px; font-weight: 600; color: #111827; line-height: 1; }
    .home-stat-label { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
    .home-today { background: #fff; border: var(--border); border-left: 3px solid var(--blue); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 24px; }
    .home-today-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .home-today-title { font-size: 15px; font-weight: 600; }
    .home-today-sched { display: flex; flex-direction: column; gap: 6px; }
    /* quote */
    .quote-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 24px; }
    .quote-text { font-size: 15px; line-height: 1.65; color: #374151; font-style: italic; }
    .quote-attr { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .quote-dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
    .q-dot { width: 6px; height: 6px; border-radius: 50%; background: #e5e7eb; cursor: pointer; transition: background .15s; border: none; padding: 0; }
    .q-dot.active { background: var(--blue); }

    /* ── DAY CARD CLICKABLE ──────────────────────── */
    .day-card.clickable { cursor: pointer; }
    .view-probs-hint { font-size: 11px; color: var(--blue); margin-top: 10px; font-weight: 500; opacity: 0; transition: opacity .18s; }

    /* ── POMODORO WIDGET ─────────────────────────── */
    .pomo-widget {
      position: fixed; bottom: 20px; left: 20px; z-index: 500;
      background: #fff; border: var(--border); border-radius: 12px;
      width: 192px; font-family: inherit;
      box-shadow: 0 2px 16px rgba(0,0,0,.09);
    }
    .pomo-widget.minimized { width: 110px; }
    .pomo-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-bottom: var(--border); }
    .pomo-mode-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .pomo-mode-work { color: var(--blue); }
    .pomo-mode-brk { color: #059669; }
    .pomo-tog { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 0; line-height: 1; }
    .pomo-body { padding: 10px 12px 12px; }
    .pomo-time-disp { font-family: 'Fira Code', monospace; font-size: 30px; font-weight: 600; text-align: center; margin-bottom: 4px; line-height: 1; }
    .pomo-time-work { color: var(--blue); }
    .pomo-time-brk { color: #059669; }
    .pomo-time-idle { color: #111827; }
    .pomo-sessions { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 10px; }
    .pomo-ctrls { display: flex; gap: 5px; }
    .pomo-btn { flex: 1; padding: 6px 4px; border-radius: 5px; border: var(--border); cursor: pointer; font-size: 11.5px; font-weight: 600; background: #fff; color: #374151; font-family: inherit; }
    .pomo-btn.go { background: var(--blue); color: #fff; border-color: var(--blue); }

function getTodayDayNum() {
  const now = new Date();
  const yr = now.getFullYear();
  const mon = now.getMonth(); // 0-indexed
  const d = now.getDate();
  const planDates = [
    {m:5,d:3},{m:5,d:4},{m:5,d:5},{m:5,d:6},{m:5,d:7},
    {m:5,d:8},{m:5,d:9},{m:5,d:10},{m:5,d:11},
  ];
  for (let i = 0; i < planDates.length; i++) {
    if (mon === planDates[i].m && d === planDates[i].d && yr === 2026) return i + 1;
  }
  return null;
}

function pad(n) { return String(n).padStart(2,'0'); }

function formatCountdown(ms) {
  if (ms <= 0) return { str:'00:00:00:00', done:true };
  const total = Math.floor(ms / 1000);
  const days = Math.floor(total / 86400);
  const hrs  = Math.floor((total % 86400) / 3600);
  const mins = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  return { str:`${pad(days)}d ${pad(hrs)}h ${pad(mins)}m ${pad(secs)}s`, days, hrs, mins, secs, total, done:false };
}

function getCountdownMsg(info) {
  if (!info || info.done) return 'Interview day — go get it.';
  if (info.days >= 9) return 'Work the plan.';
  if (info.days >= 3) return 'Focus on mocks.';
  if (info.days >= 1) return 'One mock, then rest.';
  return 'Stop cramming — breathe.';
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  // file:// fallback
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

const FC_FILTERS = ['All','Arrays','Trees','Graphs','DP','Misc'];

function Flashcards() {
  const [filter, setFilter] = useState('All');
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);

  const filtered = filter === 'All' ? FLASHCARDS : FLASHCARDS.filter(c => c.tag === filter.toLowerCase());
  const card = filtered[Math.min(idx, filtered.length - 1)];

  function changeFilter(f) { setFilter(f); setIdx(0); setFlipped(false); }
  function prev() { setIdx(i => Math.max(0, i-1)); setFlipped(false); }
  function next() { setIdx(i => Math.min(filtered.length-1, i+1)); setFlipped(false); }
  function flip() { setFlipped(f => !f); }

  if (!card) return <p style={{color:'var(--muted)'}}>No cards match this filter.</p>;

  const cur = Math.min(idx, filtered.length - 1);

  return (
    <div className="flashcard-area">
      <div className="filter-bar">
        {FC_FILTERS.map(f => (
          <button key={f} className={`filter-btn${filter===f?' active':''}`} onClick={() => changeFilter(f)}>{f}</button>
        ))}
      </div>

      <div className="flashcard-wrapper" onClick={flip}>
        <div className={`flashcard-inner${flipped ? ' flipped' : ''}`}>
          {/* FRONT */}
          <div className="fc-face">
            <div className="fc-label-row">
              <span className="badge badge-pat">{card.label}</span>
              <span style={{fontSize:'11px', color:'var(--muted)'}}>tap to flip</span>
            </div>
            <div className="fc-q">{card.q}</div>
            <div className="fc-hint">↕ click anywhere to reveal answer</div>
          </div>
          {/* BACK */}
          <div className="fc-face fc-back-face">
            <div className="fc-label-row">
              <span className="badge badge-pat">{card.label}</span>
              <span style={{fontSize:'11px', color:'var(--muted)'}}>tap to flip back</span>
            </div>
            <div className="fc-a">{card.a}</div>
          </div>
        </div>
      </div>

      <div className="fc-nav">
        <button className="nav-btn" onClick={prev} disabled={cur === 0}>← Prev</button>
        <span className="card-counter">{cur+1} / {filtered.length}</span>
        <button className="nav-btn" onClick={next} disabled={cur === filtered.length-1}>Next →</button>
      </div>
    </div>
  );
}

function getCompletedProblems() {
  try { return JSON.parse(localStorage.getItem('dsa_problems_done') || '{}'); } catch(e) { return {}; }

function saveProblemDone(id, val) {
  const all = getCompletedProblems();

function ProblemCard({ p }) {
  const [sol, setSol] = useState('brute');
  const [done, setDone] = useState(() => Boolean(getCompletedProblems()[p.id]));
  const s = sol === 'brute' ? p.brute : p.optimal;
  const lc = PROBLEM_LC[p.id];

  function toggleDone(e) {
    e.stopPropagation();
    const next = !done;
    setDone(next);
    saveProblemDone(p.id, next);
  }

  const claudePrompt =
`I'm stuck on "${p.title}" (${p.diff} difficulty, pattern: ${p.pat}).

Problem: ${p.desc}

I'm looking at the ${sol === 'brute' ? 'brute force' : 'optimal'} solution:
- Time: ${s.time} | Space: ${s.space}
- Approach: ${s.what}

Can you help me:
1. Understand the key insight that makes this approach work
2. Recognize when to use this pattern in an interview
3. Identify common edge cases and mistakes to avoid`;

  return (
    <div className={`problem-card${done ? ' is-done' : ''}`}>
      <div className="prob-head">
        <button
          className={`done-toggle${done ? ' is-done' : ''}`}
          onClick={toggleDone}
          title={done ? 'Mark as not done' : 'Mark as done'}
        >{done ? '✓' : ''}</button>
        <span className="prob-title" style={done ? {textDecoration:'line-through',color:'#6b7280'} : {}}>{p.title}</span>
        <Badge diff={p.diff} />
        <span className="badge badge-pat">{p.pat}</span>
        {lc && (
          <button
            onClick={() => window.open(`https://leetcode.com/problems/${lc.slug}/`, '_blank', 'noopener')}
            style={{marginLeft:'auto',padding:'3px 10px',border:'1px solid #FB923C',borderRadius:'5px',background:'#FFF7ED',cursor:'pointer',fontSize:'11.5px',fontWeight:'700',color:'#C2410C',fontFamily:'inherit',whiteSpace:'nowrap'}}

function Problems({ filter, setFilter }) {
  const [completedMap, setCompletedMap] = useState(getCompletedProblems);

  // Re-read when a card toggles (children call saveProblemDone then this re-syncs)
  function refreshDone() { setCompletedMap(getCompletedProblems()); }

  const isDayFilter = filter.startsWith('day:');
  const dayNum = isDayFilter ? parseInt(filter.split(':')[1]) : null;

  const visible = PROBLEMS.filter(p => {
    if (filter === 'All') return true;
    if (isDayFilter) return p.day === dayNum;
    return p.tags.includes(filter.toLowerCase());
  });

  const dayInfo = isDayFilter ? DAYS.find(d => d.num === dayNum) : null;
  const totalDone = PROBLEMS.filter(p => completedMap[p.id]).length;
  const visibleDone = visible.filter(p => completedMap[p.id]).length;
  const pct = PROBLEMS.length > 0 ? Math.round((totalDone / PROBLEMS.length) * 100) : 0;

  return (
    <div onClick={refreshDone}>
      <div className="prob-progress">
        <span className="prob-progress-text">{totalDone} / {PROBLEMS.length} problems completed</span>
        <div className="prob-progress-bar-wrap">
          <div className="prob-progress-bar-fill" style={{width:`${pct}%`}} />
        </div>
        <span style={{fontSize:'12px',color:'#059669',fontWeight:'600'}}>{pct}%</span>
        {visibleDone > 0 && filter !== 'All' && (
          <span style={{fontSize:'12px',color:'var(--muted)'}}>{visibleDone}/{visible.length} shown</span>
        )}
      </div>
      <div className="filter-bar" style={{marginBottom:'8px'}}>
        {PROB_FILTERS.map(f => (
          <button key={f} className={`filter-btn${filter===f?' active':''}`} onClick={() => setFilter(f)}>{f}</button>
        ))}
      </div>
      <div className="filter-bar" style={{marginBottom:'20px', paddingLeft:'2px'}}>
        <span style={{fontSize:'11px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'.07em',color:'var(--muted)',display:'flex',alignItems:'center',paddingRight:'4px'}}>By Day</span>
        {PROB_DAY_FILTERS.map(n => {
          const key = `day:${n}`;
          return (
            <button key={n} className={`filter-btn${filter===key?' active':''}`} onClick={() => setFilter(key)}>
              Day {n}
            </button>
          );
        })}
      </div>
      {dayInfo && (
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px',paddingBottom:'14px',borderBottom:'1px solid #e5e5e5'}}>
          <span style={{fontSize:'12px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)'}}>Day {dayInfo.num} · {dayInfo.date}</span>
          <span style={{fontSize:'15px',fontWeight:'600',color:'#111827'}}>{dayInfo.title}</span>
          <div style={{display:'flex',gap:'5px',flexWrap:'wrap'}}>
            {dayInfo.topics.map(t => <span key={t} className="topic-pill">{t}</span>)}
          </div>
        </div>
      )}
      {visible.length === 0
        ? <p style={{color:'var(--muted)'}}>No problems match this filter.</p>
        : visible.map(p => <ProblemCard key={p.id} p={p} />)
      }
    </div>
  );
}

function MockTimer() {
  const TOTAL = 45 * 60;
  const [selected, setSelected] = useState(null);
  const [diffFilter, setDiffFilter] = useState('All');
  const [timeLeft, setTimeLeft] = useState(TOTAL);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const ivRef = useRef(null);

  useEffect(() => {
    if (running) {
      ivRef.current = setInterval(() => {
        setTimeLeft(t => {
          if (t <= 1) { clearInterval(ivRef.current); setRunning(false); setDone(true); return 0; }
          return t - 1;
        });
      }, 1000);
    } else { clearInterval(ivRef.current); }
    return () => clearInterval(ivRef.current);
  }, [running]);

  function reset() { clearInterval(ivRef.current); setRunning(false); setDone(false); setTimeLeft(TOTAL); }

  const mins = Math.floor(timeLeft / 60);
  const secs = timeLeft % 60;
  const timerStr = `${pad(mins)}:${pad(secs)}`;
  const timerClass = done ? 'timer-disp done' : timeLeft <= 5*60 ? 'timer-disp danger' : timeLeft <= 10*60 ? 'timer-disp warn' : 'timer-disp';
  const alert = done ? "Time's up! State your Big O." : timeLeft <= 5*60 ? '5 min left — trace your solution!' : timeLeft <= 10*60 ? '10 min left — start wrapping up.' : '';
  const alertClass = timeLeft <= 5*60 ? 'timer-alert danger' : 'timer-alert';

  const DIFF_COLORS = { All:'#374151', Easy:'#27500A', Medium:'#633806', Hard:'#791F1F' };
  const DIFF_BG    = { All:'#fff',    Easy:'#EAF3DE', Medium:'#FAEEDA',  Hard:'#FCEBEB' };

  const filteredProblems = diffFilter === 'All' ? PROBLEMS : PROBLEMS.filter(p => p.diff === diffFilter.toLowerCase());
  const selectedProblem = selected ? PROBLEMS.find(p => p.id === selected) : null;

  return (
    <div>
      {/* Difficulty filter */}
      <div style={{display:'flex',gap:'8px',marginBottom:'12px',alignItems:'center'}}>
        <span style={{fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.07em',color:'var(--muted)'}}>Difficulty:</span>
        {['All','Easy','Medium','Hard'].map(d => (
          <button key={d} onClick={() => setDiffFilter(d)}
            style={{
              padding:'5px 14px', borderRadius:'100px', border:'1px solid',
              borderColor: diffFilter===d ? DIFF_COLORS[d] : '#e5e5e5',
              background: diffFilter===d ? DIFF_BG[d] : '#fff',
              color: diffFilter===d ? DIFF_COLORS[d] : '#6b7280',
              cursor:'pointer', fontSize:'12.5px', fontWeight:'600', fontFamily:'inherit',
              transition:'all .15s',
            }}
          >{d}</button>
        ))}
        <span style={{marginLeft:'auto',fontSize:'12px',color:'var(--muted)'}}>{filteredProblems.length} problem{filteredProblems.length!==1?'s':''}</span>
      </div>

      {/* Problem selection grid */}
      <div className="mock-grid">
        {filteredProblems.map(p => (
          <div key={p.id} className={`mock-card${selected===p.id?' selected':''}`}
            onClick={() => setSelected(id => id===p.id ? null : p.id)}>
            <div className="mock-title">{p.title}</div>
            <div style={{display:'flex',gap:'6px',alignItems:'center',marginTop:'4px'}}>
              <Badge diff={p.diff} />
              <span className="mock-pat">{p.pat}</span>
            </div>
          </div>
        ))}
      </div>

      {/* Problem statement panel */}
      {selectedProblem
        ? <ProblemPanel problem={selectedProblem} />
        : <div className="mock-no-problem">← Select a problem above to see the full statement, examples, and constraints.</div>
      }

      {/* Timer */}
      <div className="timer-wrap">
        <div className={timerClass}>{timerStr}</div>
        <div className={alertClass}>{alert}</div>
      </div>
      <div className="timer-ctrls">
        {!running && !done && <button className="t-btn primary" onClick={() => setRunning(true)}>Start</button>}
        {running && <button className="t-btn" onClick={() => setRunning(false)}>Pause</button>}
        {!running && done && <button className="t-btn primary" onClick={reset}>Start New Mock</button>}
        {(running || (!done && timeLeft < TOTAL)) && <button className="t-btn" onClick={reset}>Reset</button>}
      </div>

      {/* Protocol */}
      <div className="protocol-card">
        <div className="protocol-title">Mock Protocol</div>
        {[
          {t:'0–5 min',d:'Clarify inputs, outputs, constraints, edge cases — do not write code yet.'},
          {t:'5–10 min',d:'State a brute force approach out loud and its complexity.'},
          {t:'10–30 min',d:'Code the optimized solution, narrating every line.'},
          {t:'30–40 min',d:'Trace through a concrete example to verify.'},
          {t:'40–45 min',d:'State Big O time and space, discuss edge cases.'},
        ].map(item => (
          <div key={item.t} className="p-item">
            <span className="p-time">{item.t}</span>
            <span className="p-desc">{item.d}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

            <AnnotatedCode lines={algo.code.filter(l => l.c !== '')} />
          )}
          {algo.pitfalls && algo.pitfalls.length > 0 && (
            <>
              <div className="ds-section-label" style={{marginTop:'12px'}}>Pitfalls</div>
              <div className="pitfall-list">{algo.pitfalls.map((p,i) => <div key={i} className="pitfall-item">⚠ {p}</div>)}</div>
            </>
          )}
          <LCProblems problems={ALGO_LEETCODE[algo.name]} />
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   SIDE TIMER (right edge, vertically centered)
═══════════════════════════════════════════════════════════ */

const ST_MIN = 15 * 60;
const ST_MAX = 120 * 60;
const ST_STEP = 15 * 60;
const ST_DEFAULT = 45 * 60;

function SideTimer() {
  const [preset, setPreset] = useState(ST_DEFAULT);
  const [timeLeft, setTimeLeft] = useState(ST_DEFAULT);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const ivRef = useRef(null);

  useEffect(() => {
    if (running) {
      ivRef.current = setInterval(() => {
        setTimeLeft(t => {
          if (t <= 1) {
            clearInterval(ivRef.current);
            setRunning(false);
            setDone(true);
            return 0;
          }
          return t - 1;
        });
      }, 1000);
    } else {
      clearInterval(ivRef.current);
    }
    return () => clearInterval(ivRef.current);
  }, [running]);

  function changePreset(delta) {
    const next = Math.min(ST_MAX, Math.max(ST_MIN, preset + delta));
    setPreset(next);
    if (!running) { setTimeLeft(next); setDone(false); }
  }

  function reset() {
    clearInterval(ivRef.current);
    setRunning(false);
    setDone(false);
    setTimeLeft(preset);
  }

  const mins = pad(Math.floor(timeLeft / 60));
  const secs = pad(timeLeft % 60);
  const presetMins = preset / 60;
  const timeClass = done ? 'st-time done' : running ? 'st-time running' : 'st-time';

  return (
    <div className="side-timer">
      <button className="st-incr-btn" onClick={() => changePreset(ST_STEP)} disabled={preset >= ST_MAX}>+15m</button>
      <div className="st-divider" />
      <div className={timeClass}>{mins}:{secs}</div>
      <div className="st-label">{running ? 'running' : done ? 'done' : `${presetMins}m set`}</div>
      <div className="st-ctrl-row">
        <button
          className={`st-ctrl go`}
          onClick={() => { if (done) reset(); else setRunning(r => !r); }}
          title={done ? 'Reset' : running ? 'Pause' : 'Start'}
        >
          {done ? '↺' : running ? '‖' : '▶'}
        </button>
        <button className="st-ctrl" onClick={reset} title="Reset">↺</button>
      </div>
      <div className="st-divider" />
      <button className="st-incr-btn" onClick={() => changePreset(-ST_STEP)} disabled={preset <= ST_MIN}>-15m</button>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   POMODORO WIDGET
═══════════════════════════════════════════════════════════ */

const POMO_WORK = 25 * 60;
const POMO_BREAK = 5 * 60;

function Pomodoro() {
  const [mode, setMode] = useState('work'); // 'work' | 'break'
  const [timeLeft, setTimeLeft] = useState(POMO_WORK);
  const [running, setRunning] = useState(false);
  const [sessions, setSessions] = useState(0);
  const [minimized, setMinimized] = useState(false);
  const ivRef = useRef(null);

  useEffect(() => {
    if (running) {
      ivRef.current = setInterval(() => {
        setTimeLeft(t => {
          if (t <= 1) {
            clearInterval(ivRef.current);
            setRunning(false);
            if (mode === 'work') {
              setSessions(s => s + 1);
              setMode('break');
              setTimeLeft(POMO_BREAK);
            } else {
              setMode('work');
              setTimeLeft(POMO_WORK);
            }
            return 0;
          }
          return t - 1;
        });
      }, 1000);
    } else {
      clearInterval(ivRef.current);
    }
    return () => clearInterval(ivRef.current);
  }, [running, mode]);

  function reset() {
    clearInterval(ivRef.current);
    setRunning(false);
    setTimeLeft(mode === 'work' ? POMO_WORK : POMO_BREAK);
  }

  function switchMode(m) {
    clearInterval(ivRef.current);
    setRunning(false);
    setMode(m);
    setTimeLeft(m === 'work' ? POMO_WORK : POMO_BREAK);
  }

  const mins = pad(Math.floor(timeLeft / 60));
  const secs = pad(timeLeft % 60);
  const timeStr = `${mins}:${secs}`;
  const timeClass = running ? (mode === 'work' ? 'pomo-time-work' : 'pomo-time-brk') : 'pomo-time-idle';
  const modeLabel = mode === 'work' ? 'Work' : 'Break';
  const modeClass = mode === 'work' ? 'pomo-mode-work' : 'pomo-mode-brk';

  return (
    <div className={`pomo-widget${minimized ? ' minimized' : ''}`}>
      <div className="pomo-header">
        {!minimized && <span className={`pomo-mode-label ${modeClass}`}>{modeLabel}</span>}
        {minimized && <span style={{fontSize:'10px',fontWeight:'700',textTransform:'uppercase',color:'var(--muted)',letterSpacing:'.06em'}}>Pomo</span>}
        <button className="pomo-tog" onClick={() => setMinimized(m => !m)} title={minimized ? 'Expand' : 'Minimize'}>
          {minimized ? '▲' : '▼'}
        </button>
      </div>
      {minimized ? (
        <div className="pomo-mini-body" onClick={() => setMinimized(false)} style={{cursor:'pointer'}}>
          <div className={`pomo-mini-time ${timeClass}`}>{timeStr}</div>
          <div className="pomo-mini-mode">{modeLabel}</div>
        </div>
      ) : (
        <div className="pomo-body">
          <div className={`pomo-time-disp ${timeClass}`}>{timeStr}</div>
          <div className="pomo-sessions">{sessions} session{sessions !== 1 ? 's' : ''} done</div>
          <div className="pomo-ctrls">
            <button className={`pomo-btn go`} onClick={() => setRunning(r => !r)}>
              {running ? 'Pause' : 'Start'}
            </button>
            <button className="pomo-btn" onClick={reset}>Reset</button>
            <button className="pomo-btn" onClick={() => switchMode(mode === 'work' ? 'break' : 'work')}>
              {mode === 'work' ? '☕' : '💻'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
